version: '3.8'

services:
  db:
    build:
      context: ./Database
    container_name: ru_digital_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ru_digital
      MYSQL_USER: ru_user
      MYSQL_PASSWORD: rupassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: ru_digital_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=ru_user
      - DB_PASSWORD=rupassword
      - DB_NAME=ru_digital
      - DB_PORT=3306
      - DB_CONN_LIMIT=10
      - FRONTEND_URL=http://localhost:3000
      - ACCESS_TOKEN_SECRET=dev_access_secret_123
      - REFRESH_TOKEN_SECRET=dev_refresh_secret_123
      - ACCESS_TOKEN_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=7d
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    container_name: ru_digital_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: